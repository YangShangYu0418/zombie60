<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zombie60</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="title">Zombie60</div>
      <div class="sub">深坑・封城三十日</div>
    </div>
    <div class="daychip" id="dayChip"></div>
    <div class="top-actions">
      <button id="btnSave">存檔</button>
      <button id="btnLoad">讀檔</button>
      <button id="btnNew" class="danger">新局</button>
    </div>
  </header>

  <div id="resbar" class="resbar"></div>

  <main class="layout">
    <section class="col-main">
      <div class="panel stage" id="stage"></div>
      <div class="panel" id="teamPanel">
        <h2>隊伍</h2>
        <div id="team"></div>
      </div>
    </section>

    <section class="col-side">
      <div class="panel" id="mapPanel">
        <h2>世界地圖 <span class="h2-sub" id="weatherTag"></span></h2>
        <div class="map-wrap" id="mapWrap"><svg id="map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg></div>
        <div id="locInfo" class="locinfo"></div>
      </div>
      <div class="panel" id="feedPanel">
        <h2>世界動態</h2>
        <div id="radio" class="radio"></div>
        <div id="feed" class="feed"></div>
      </div>
      <div class="panel" id="tabsPanel">
        <div class="tabs">
          <button class="tab active" data-tab="quests">任務簿</button>
          <button class="tab" data-tab="factions">勢力</button>
          <button class="tab" data-tab="log">日誌</button>
        </div>
        <div id="tabBody"></div>
      </div>
    </section>
  </main>

  <footer>Zombie60 原型 • 純前端、JSON 內容驅動 • 存檔存在瀏覽器 localStorage</footer>

  <script type="module" src="main.js"></script>
</body>
</html>
